<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de tarefas</title>
    <link rel="stylesheet" href="../style/style.css">
</head>

<body>

    <div class="containersite">
    <header>
    <h1>Gerenciador de tarefas</h1>
    </header>
    <div class="form-tarefa">
    <input type="text" id="tarefa" placeholder="Digite o nome da tarefa aqui...">
    <select id="cor" name="cor" class="select-cor">
        <option value="#7ef8a3">baixa</option>
        <option value="#ecf87e">média</option>
        <option value="#f87e7e">alta</option> 
    </select>
    <button onclick="tarefa()">OK</button>
    </div>

    <ul id="lista">

    </ul>
    </div>

</body>
<script>

    function tarefa(){


        let t = document.getElementById("tarefa");

        if (t.value.trim() === "") {
    alert("Por favor preencha o campo a baixo.");
    return;
}
        let cor = document.getElementById("cor");
        let ul = document.getElementById("lista");
        let li = document.createElement("li");
        li.innerHTML= t;
        ul.appendChild(li);
        li.innerHTML = t.value;
        li.classList.add("tarefa-card");

        
        let cortexto = cor.value;
        li.style.backgroundColor = cortexto;
        li.style.color = "black"; 
    
        ul.appendChild(li);
        t.value = ""; 
    }

</script>
</html>
